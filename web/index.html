<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poros One - Local Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-white h-screen flex flex-col font-sans text-gray-800">

    <!-- Navbar -->
    <nav class="bg-white p-4 border-b border-gray-200 flex justify-between items-center z-10 sticky top-0">
        <h1 class="text-lg font-semibold flex items-center gap-2 text-gray-800">
            <span class="text-xl">⚪</span> Poros One
        </h1>
        <span id="connection-status" class="px-2 py-1 bg-gray-100 border border-gray-300 rounded text-[10px] font-medium uppercase tracking-wider text-gray-500">Offline</span>
    </nav>

    <!-- Main Chat Area -->
    <main class="flex-1 overflow-y-auto p-4 md:p-8 space-y-6 no-scrollbar max-w-4xl mx-auto w-full" id="chat-container">
        <div class="flex justify-start">
            <div class="text-gray-700 bg-gray-50 px-5 py-4 rounded-2xl rounded-tl-none max-w-2xl text-sm leading-relaxed">
                <p>Halo Mas Amir. Sistem online. Apa yang bisa saya bantu hari ini?</p>
            </div>
        </div>
    </main>

    <!-- Input Area -->
    <footer class="bg-white p-4 pb-6 z-10 w-full">
        <form id="chat-form" class="max-w-4xl mx-auto flex gap-3 relative items-center border border-gray-300 rounded-xl px-4 py-2 bg-gray-50 focus-within:bg-white focus-within:border-gray-400 focus-within:shadow-sm transition-all duration-200">
            <input type="text" id="chat-input" class="flex-1 bg-transparent focus:outline-none text-sm py-2" placeholder="Ketik perintah Anda..." autocomplete="off">
            <button type="submit" class="text-gray-400 hover:text-black transition p-2" id="send-btn" title="Kirim">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                </svg>
            </button>
        </form>
    </footer>

    <!-- HitL Approval Modal -->
    <div id="hitl-modal" style="display: none;" class="fixed inset-0 bg-white/80 backdrop-blur-sm justify-center items-center z-50 opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-xl shadow-[0_8px_30px_rgb(0,0,0,0.12)] border border-gray-100 max-w-md w-full mx-4 overflow-hidden transform scale-95 transition-transform duration-300" id="hitl-modal-content">
            <div class="p-6 pb-4">
                <div class="flex items-center gap-3 mb-4">
                    <div class="w-2 h-2 rounded-full bg-red-500"></div>
                    <h2 class="text-sm font-bold uppercase tracking-wider text-gray-800">Otorisasi Level 3</h2>
                </div>
                <p class="text-gray-600 text-sm mb-4 leading-relaxed">Sistem membutuhkan izin manual untuk melanjutkan tindakan ini:</p>
                <div class="bg-gray-50 p-4 rounded text-xs font-mono text-gray-700 break-words mb-6 border border-gray-200 shadow-inner" id="hitl-message"></div>

                <div class="flex gap-3">
                    <button id="btn-reject" class="flex-1 bg-white border border-gray-200 text-gray-700 hover:bg-gray-50 text-sm font-medium py-2.5 px-4 rounded-lg transition">
                        Tolak (N)
                    </button>
                    <button id="btn-approve" class="flex-1 bg-black hover:bg-gray-800 text-white text-sm font-medium py-2.5 px-4 rounded-lg transition">
                        Izinkan (Y)
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script src="/static/main.js"></script>
</body>
</html>
